name: Build iMessage APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip iMessage_Android_Starter.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd iMessage
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: iMessage-APK
          path: iMessage/app/build/outputs/apk/debug/app-debug.apk
